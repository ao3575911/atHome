# Record of the repository settings applied through the GitHub API.
# Not read by any app; update it when settings change.
repository:
  name: atHome
  private: false
  has_wiki: false
  has_projects: false
  has_issues: true
  has_discussions: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_update_branch: true
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
security:
  secret_scanning: enabled
  secret_scanning_push_protection: enabled
  private_vulnerability_reporting: enabled
  dependabot_alerts: enabled
  dependabot_security_updates: enabled
actions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: true
rulesets:
  main:
    target: default branch
    bypass_actors: none
    rules:
      - pull_request (0 approvals, squash only, review threads resolved)
      - required_status_checks: test (branch up to date)
      - required_signatures
      - required_linear_history
      - non_fast_forward
      - deletion
