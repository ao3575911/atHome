name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_hosted_postgres:
        description: "Run hosted Postgres adapter verification lane"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (Prettier)
        run: npm run lint
      - name: Check links (offline, relative links and anchors)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path node_modules './**/*.md'
          fail: true
      - name: Typecheck packages
        run: npm run typecheck
      - name: Typecheck web
        run: npm run typecheck:web
      - name: Test
        run: npm test
      - name: Build npm packages
        run: npm run build:packages
      - name: Dependency audit
        run: npm run audit:high
      - name: Build web
        run: npm run build:web

  hosted-postgres:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosted_postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.ATHOME_VERIFY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Validate required secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing ATHOME_VERIFY_DATABASE_URL secret"
            exit 1
          fi
      - run: npm ci
      - run: npm install --no-save --package-lock=false pg
      - run: npm run verify:postgres
