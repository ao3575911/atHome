version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type:maintenance", "dependencies"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["type:maintenance", "dependencies"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
