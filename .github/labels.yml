# Source of truth for labels. .github/workflows/labels.yml syncs this file to
# GitHub on every change to main. Labels not listed here are deleted.

- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken"
  from_name: "bug"
- name: "type:feature"
  color: "a2eeef"
  description: "New capability or enhancement"
  from_name: "enhancement"
- name: "type:documentation"
  color: "0075ca"
  description: "Documentation change"
  from_name: "documentation"
- name: "type:security"
  color: "b60205"
  description: "Security-related change"
  from_name: "security"
- name: "type:maintenance"
  color: "c5def5"
  description: "Refactor, tooling, dependencies, CI"
- name: "area:protocol"
  color: "5319e7"
  description: "protocol area"
  from_name: "protocol"
- name: "area:api"
  color: "5319e7"
  description: "api area"
- name: "area:sdk"
  color: "5319e7"
  description: "sdk area"
  from_name: "dx"
- name: "area:web"
  color: "5319e7"
  description: "web area"
  from_name: "web"
- name: "area:identity"
  color: "5319e7"
  description: "identity area"
- name: "area:registry"
  color: "5319e7"
  description: "registry area"
- name: "area:cli"
  color: "5319e7"
  description: "cli area"
- name: "area:docs"
  color: "5319e7"
  description: "docs area"
- name: "area:ops"
  color: "5319e7"
  description: "ops area"
  from_name: "ops"
- name: "priority:p0"
  color: "b60205"
  description: "Critical"
- name: "priority:p1"
  color: "d93f0b"
  description: "High"
- name: "priority:p2"
  color: "fbca04"
  description: "Medium"
- name: "priority:p3"
  color: "0e8a16"
  description: "Low"
- name: "status:needs-triage"
  color: "ededed"
  description: "Awaiting triage"
- name: "status:blocked"
  color: "000000"
  description: "Blocked"
- name: "status:ready"
  color: "0e8a16"
  description: "Ready to work"
- name: "type:release"
  color: "fbca04"
  description: "Release tracking and gate checklists"
  from_name: "release"
- name: "type:question"
  color: "d876e3"
  description: "Question about usage or design"
  from_name: "question"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency update"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already exists elsewhere"
- name: "invalid"
  color: "e4e669"
  description: "Not valid or not reproducible"
- name: "wontfix"
  color: "ffffff"
  description: "Will not be worked on"
